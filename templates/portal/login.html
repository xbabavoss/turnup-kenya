{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal login | Turn Up Kenya</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
  <div class="portal-login-wrap">
    <div class="portal-login-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="brand-mark" style="margin: 0 auto;">P</span>
        <h1 class="font-display" style="margin: 1rem 0 0; font-size: 1.5rem;">Organizer portal</h1>
        <p class="text-muted" style="font-size: 0.875rem; margin: 0.35rem 0 0;">Staff login only</p>
      </div>
      {% if messages %}{% for message in messages %}<p class="alert alert-info">{{ message }}</p>{% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-row">
          <label>Username</label>
          <input type="text" name="username" class="np-input" required autofocus>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" class="np-input" required>
        </div>
        <button type="submit" class="btn btn-brand" style="width: 100%; margin-top: 0.5rem;">Sign in</button>
      </form>
      <p style="text-align: center; margin-top: 1.25rem;"><a href="{% url 'home' %}" class="text-muted" style="font-size: 0.875rem;">Back to site</a></p>
    </div>
  </div>
</body>
</html>
